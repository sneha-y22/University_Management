spring.application.name=course-service

# Import all config from Config Server
spring.config.import=configserver:http://admin:admin@localhost:8888/

spring.cloud.config.username=admin
spring.cloud.config.password=admin
spring.cloud.config.fail-fast=false

# Local overrides (only if needed)
server.port=7004

# Eureka (imported from Config Server but safe to keep)
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

